<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA - оценка диалога</title>
  <!--
    Веб-ресурс Dynamics 365 (тип «Веб-страница (HTML)»), например cqa_/dialog_card.html.
    Ставится на форму обращения / разговора как веб-ресурс и показывает карточку оценки CQA
    для диалога этой записи: транскрипт, баллы, обоснования, апелляции.

    Как определяется диалог (по порядку):
      1. параметр data веб-ресурса на форме: «p1-ru-001», «dialog=p1-ru-001» или «appeal=12»;
      2. поле записи с ID разговора (CONVERSATION_FIELD ниже) через Xrm формы;
      3. без ID - открывается список диалогов.
    Имя пользователя CRM передаётся в CQA и попадает в журнал действий (апелляции, решения).
  -->
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #F6F8F7; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    .msg { padding: 16px; color: #44554C; font-size: 14px; }
  </style>
</head>
<body>
  <div class="msg" id="msg">Загрузка CQA…</div>
  <script>
    // Адрес развёрнутого CQA. CORS здесь не нужен: страница CQA открывается в iframe целиком,
    // со своего адреса, и ходит в свой же API.
    var CQA_URL = 'https://cqa.example.kz';
    // Логическое имя поля записи с ID разговора (conversation_id из системы чатов / телефонии).
    var CONVERSATION_FIELD = 'cqa_conversationid';
    // Роль в CQA для пользователей этой формы: supervisor (подаёт апелляции) или reviewer (решает).
    var ROLE = 'supervisor';

    function xrm() {
      try { if (window.parent && window.parent.Xrm) return window.parent.Xrm; } catch (e) { /* другой origin */ }
      return window.Xrm || null;
    }

    function fromData() {
      var p = new URLSearchParams(location.search).get('data');
      return p || '';
    }

    function fromForm() {
      var X = xrm();
      try {
        var attr = X && X.Page && X.Page.getAttribute && X.Page.getAttribute(CONVERSATION_FIELD);
        var v = attr && attr.getValue();
        return v ? 'dialog=' + v : '';
      } catch (e) { return ''; }
    }

    function userName() {
      var X = xrm();
      try { return X.Utility.getGlobalContext().userSettings.userName || ''; } catch (e) { return ''; }
    }

    var target = fromData() || fromForm();
    var q = new URLSearchParams({ embed: '1', role: ROLE });
    if (target) q.set('data', target);
    var user = userName();
    if (user) q.set('user', user);

    var frame = document.createElement('iframe');
    frame.title = 'CQA - оценка качества диалога';
    frame.src = CQA_URL.replace(/\/+$/, '') + '/?' + q.toString();
    frame.onload = function () { document.getElementById('msg').remove(); };
    document.body.appendChild(frame);
  </script>
</body>
</html>
